const map=L.map('map',{center:[24.155,120.66],zoom:12,zoomControl:false});
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);

const markers={};const catVisible={souvenir:true,coffee:true,dessert:true,tea:true};
let counter={souvenir:0,coffee:0,dessert:0,tea:0};

shops.forEach(s=>{
  counter[s.cat]++;
  const c=CAT_COLORS[s.cat];
  const icon=L.divIcon({className:'',html:`<div class="cm" id="mk-${s.id}" style="background:${c}">${counter[s.cat]}</div>`,iconSize:[28,28],iconAnchor:[14,14],popupAnchor:[0,-16]});
  const popup=`<div class="popup-inner">
    <span class="p-cat" style="background:${c}">${CAT_LABELS[s.cat]}</span>
    <div class="p-name">${s.name}</div>
    <div class="p-note">${s.note}</div>
    <div class="p-meta"><span><span class="star">★</span> ${s.rating}</span><span>${s.reviews.toLocaleString()} 則</span></div>
    <div class="p-addr">📍 ${s.address}</div>
    <a class="p-link" href="${s.gmaps}" target="_blank">Google Maps →</a>
  </div>`;
  const m=L.marker([s.lat,s.lng],{icon}).addTo(map);
  m.bindPopup(popup,{maxWidth:280,closeButton:false});
  m.on('click',()=>hlShop(s.id));
  markers[s.id]={marker:m,cat:s.cat};
});

// Sidebar
const listEl=document.getElementById('sidebarList');
let curCat=null;
['souvenir','coffee','dessert','tea'].forEach(cat=>{
  const hdr=document.createElement('div');
  hdr.style.cssText=`padding:10px 20px 6px;font-size:12px;font-weight:700;color:${CAT_COLORS[cat]};border-top:2px solid ${CAT_COLORS[cat]}20;margin-top:4px`;
  hdr.textContent=`${cat==='souvenir'?'🎁':cat==='coffee'?'☕':cat==='dessert'?'🍰':'🍵'} ${CAT_LABELS[cat]}`;
  listEl.appendChild(hdr);
  shops.filter(s=>s.cat===cat).forEach(s=>{
    const d=document.createElement('div');d.className='shop-item';d.id=`si-${s.id}`;d.dataset.cat=cat;
    d.innerHTML=`<div class="shop-name">${s.name}</div><div class="shop-note">${s.note}</div><div class="shop-rating">★ ${s.rating}　${s.reviews.toLocaleString()} 則</div>`;
    d.addEventListener('click',()=>{map.setView([s.lat,s.lng],16,{animate:true});markers[s.id].marker.openPopup();hlShop(s.id);});
    listEl.appendChild(d);
  });
});

function hlShop(id){
  document.querySelectorAll('.shop-item').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.cm').forEach(e=>e.classList.remove('hl'));
  const si=document.getElementById(`si-${id}`);const mk=document.getElementById(`mk-${id}`);
  if(si){si.classList.add('active');si.scrollIntoView({behavior:'smooth',block:'nearest'});}
  if(mk)mk.classList.add('hl');
}

function toggleCat(cat){
  catVisible[cat]=!catVisible[cat];
  document.querySelector(`.fbtn[data-cat="${cat}"]`).classList.toggle('active',catVisible[cat]);
  Object.entries(markers).forEach(([id,o])=>{
    if(o.cat===cat){catVisible[cat]?o.marker.addTo(map):map.removeLayer(o.marker);}
  });
  document.querySelectorAll(`.shop-item[data-cat="${cat}"]`).forEach(el=>{el.style.display=catVisible[cat]?'':'none';});
  // Also toggle category headers
  listEl.querySelectorAll('div').forEach(d=>{if(d.textContent.includes(CAT_LABELS[cat])&&!d.classList.contains('shop-item'))d.style.display=catVisible[cat]?'':'none';});
}

let sOpen=true;
function toggleSidebar(){
  sOpen=!sOpen;
  document.getElementById('sidebar').classList.toggle('closed',!sOpen);
  const btn=document.getElementById('toggle-sidebar');
  btn.classList.toggle('collapsed',!sOpen);
  btn.textContent=sOpen?'◀':'▶';
}

let myMk=null,myCir=null;
function locateMe(){
  const btn=document.getElementById('locate-btn');
  if(!navigator.geolocation){alert('瀏覽器不支援定位');return;}
  btn.classList.add('locating');
  navigator.geolocation.getCurrentPosition(p=>{
    btn.classList.remove('locating');
    const{latitude:la,longitude:ln,accuracy:ac}=p.coords;
    if(myMk)map.removeLayer(myMk);if(myCir)map.removeLayer(myCir);
    myMk=L.marker([la,ln],{icon:L.divIcon({className:'',html:'<div class="my-loc-dot"></div>',iconSize:[16,16],iconAnchor:[8,8]}),zIndexOffset:9999}).addTo(map).bindPopup('<div style="padding:8px;font-size:13px;font-weight:700;color:#1a73e8">📍 你的位置</div>',{closeButton:false});
    myCir=L.circle([la,ln],{radius:ac,color:'rgba(26,115,232,.4)',fillColor:'rgba(26,115,232,.08)',fillOpacity:1,weight:2}).addTo(map);
    map.setView([la,ln],14,{animate:true});myMk.openPopup();
  },e=>{btn.classList.remove('locating');alert(['','定位被拒絕','無法取得位置','定位逾時'][e.code]);},{enableHighAccuracy:true,timeout:10000,maximumAge:0});
}
</script>
